[package]
name = "jetski-host"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Experimental native host backend for portable durable sandboxes"
publish = false

[dependencies]
base64 = "=0.22.1"
flate2 = "=1.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
rustix = { version = "=1.1.4", features = ["fs", "process", "net", "event"] }


[profile.release]
lto = "thin"
codegen-units = 1
strip = true
