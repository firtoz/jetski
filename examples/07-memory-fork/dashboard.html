<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jetski — one moment, three futures</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#071116;color:#e1efef;font:16px system-ui}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{color:#6fe8c5;font-weight:800;letter-spacing:4px;font-size:13px}h1{font-size:36px;font-weight:550;letter-spacing:-1.5px;margin:10px 0}p{color:#8ea8b2;margin:0;font-size:14px}#clock{font:24px ui-monospace,monospace;color:#6fe8c5}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.panel{min-width:0;background:#0e1e26;border:1px solid #24404b;border-radius:16px;overflow:hidden}.label{padding:16px;display:flex;align-items:center;justify-content:space-between}.label strong{font-size:17px}.badge{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94b0bd}.display{aspect-ratio:16/10;position:relative;background:#000;overflow:hidden}.still{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.still[hidden]{display:none}.frozen .cover{background:#0006;justify-content:flex-end;padding-bottom:16px}iframe{width:100%;height:100%;border:0;display:block}.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:15px;padding:20px;text-align:center;background:#000;color:#b2c9d1;font-size:13px}.cover[hidden]{display:none}.spinner{width:24px;height:24px;border:2px solid #243b41;border-top-color:#6fe8c5;border-radius:50%;animation:spin 1s linear infinite}.spinner[hidden]{display:none}@keyframes spin{to{transform:rotate(360deg)}}.status{padding:14px 16px;color:#bed2d7;font-size:13px;border-bottom:1px solid #24404b;min-height:48px}ol{list-style:none;padding:14px 16px;margin:0;height:270px;overflow:auto;font:12px/1.7 ui-monospace,monospace}li{display:grid;grid-template-columns:60px 1fr;gap:10px;margin-bottom:9px}time{color:#6fe8c5}li span{color:#98b2bd}.footer{margin-top:22px;display:flex;justify-content:space-between;color:#668692;font-size:12px}.failed .badge{color:#ff9e93}.live .badge,.complete .badge{color:#6fe8c5}.frozen .badge{color:#d5b6ff}#connection{color:#93aeb8}@media(max-width:900px){body{padding:20px}.panels{gap:12px}h1{font-size:28px}.label{padding:12px}.label strong{font-size:14px}}
</style></head><body>
<header><div><div class="brand">JETSKI</div><h1>One moment. Three futures.</h1><p>Chromium memory + disk · isolated branches · real lifecycle timings</p></div><div id="clock">0.0s</div></header>
<main class="panels"></main><div class="footer"><span>Live desktops powered by Voxl · Boat hosts · gVisor isolation</span><span id="connection">Connecting to controller…</span></div>
<script>
const ids=['source','a','b'];const titles=['Original / source','Branch A','Branch B'];const panels=new Map();
for(let i=0;i<ids.length;i++){const panel=document.createElement('section');panel.className='panel';panel.innerHTML='<div class="label"><strong></strong><span class="badge">Waiting</span></div><div class="display"><iframe title="Sandbox desktop" hidden allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe><img class="still" alt="Frozen checkpoint desktop" hidden><div class="cover"><div class="spinner" hidden></div><span>Not started</span></div></div><div class="status">Waiting for controller</div><ol aria-label="Lifecycle timeline"></ol>';panel.querySelector('strong').textContent=titles[i];document.querySelector('main').append(panel);panels.set(ids[i],panel)}
let seen=0, elapsed=0, arrived=performance.now(), connected=false;setInterval(()=>{if(connected)document.querySelector('#clock').textContent=((elapsed+performance.now()-arrived)/1000).toFixed(1)+'s'},100);const events=new EventSource('/events');
events.onopen=()=>{connected=true;document.querySelector('#connection').textContent='Connected · actual controller events'};
events.onerror=()=>{connected=false;document.querySelector('#connection').textContent='Disconnected · waiting to reconnect'};
events.onmessage=({data})=>{const event=JSON.parse(data);if(event.sequence<=seen)return;const panel=panels.get(event.panel);if(!panel)return;seen=event.sequence;elapsed=event.elapsedMs;arrived=performance.now();panel.className='panel '+event.phase;panel.querySelector('.badge').textContent=event.phase;panel.querySelector('.status').textContent=event.message;document.querySelector('#clock').textContent=(event.elapsedMs/1000).toFixed(1)+'s';const cover=panel.querySelector('.cover');const frame=panel.querySelector('iframe');const still=panel.querySelector('.still');still.hidden=!event.snapshotUrl;if(event.snapshotUrl)still.src=event.snapshotUrl;panel.querySelector('.spinner').hidden=event.phase!=='loading';panel.querySelector('.cover span').textContent=event.message;
if(event.desktopUrl){if(frame.getAttribute('src')!==event.desktopUrl)frame.src=event.desktopUrl;frame.hidden=false;cover.hidden=true}else if(['loading','frozen','failed','waiting'].includes(event.phase)){frame.removeAttribute('src');frame.hidden=true;cover.hidden=false}
const row=document.createElement('li');const time=document.createElement('time');time.textContent=(event.elapsedMs/1000).toFixed(1)+'s';const message=document.createElement('span');message.textContent=event.message;row.append(time,message);const log=panel.querySelector('ol');log.append(row);log.scrollTop=log.scrollHeight;};
</script></body></html>
