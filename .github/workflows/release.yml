name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag on main with green CI
        required: true
      verify_existing:
        description: Observe a version already uploaded (including automated review); never republish
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Require exact version tag, main ancestry and completed green source CI
        run: |
          node --input-type=module -e 'import p from "./package.json" with {type:"json"};if(process.env.TAG!==`v${p.version}`)throw Error("Tag/version mismatch")'
          git merge-base --is-ancestor HEAD origin/main
          sha=$(git rev-parse HEAD)
          result=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --json conclusion --jq 'map(select(.conclusion=="success"))|length')
          test "$result" -gt 0
          echo "SOURCE_SHA=$sha" >> "$GITHUB_ENV"
      - run: npm install --global npm@11.15.0
      - run: npm ci
      - run: npm run build
      - run: node scripts/qualify-package.mjs
      - run: npm audit --omit=dev
      - name: Pack immutable artifact and checksums
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          cp docs/openapi.json release/openapi.json
          printf '%s\n' "$SOURCE_SHA" > release/SOURCE_SHA
          (cd release && sha256sum *.tgz openapi.json SOURCE_SHA > SHA256SUMS)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/firtoz/jetski:${{ env.TAG }}
          provenance: mode=max
          sbom: true
      - name: Record image identity
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'ghcr.io/firtoz/jetski@%s\n' "$DIGEST" > release/IMAGE
          (cd release && sha256sum IMAGE >> SHA256SUMS)
      - name: Publish through npm trusted identity or verify an existing upload
        env:
          VERIFY_EXISTING: ${{ inputs.verify_existing || 'false' }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          if npm view "$name@$version" dist.integrity --json > /tmp/jetski-registry.json; then
            echo "Version is visible; verify identity below"
          elif [ "$VERIFY_EXISTING" = "true" ]; then
            echo "Upload already acknowledged; observe automated review without republishing"
          else
            node --input-type=module -e 'import{readFileSync}from"node:fs";const r=JSON.parse(readFileSync("/tmp/jetski-registry.json"));if(r.error?.code!=="E404")throw Error("Registry lookup failed; refusing uncertain publication")'
            npm publish ./release/*.tgz --access public --provenance --ignore-scripts
          fi
          node --input-type=module <<'JS'
          import {readFileSync,readdirSync} from "node:fs";
          import {createHash} from "node:crypto";
          const p=JSON.parse(readFileSync("package.json"));
          const f=readdirSync("release").find(f=>f.endsWith(".tgz"));
          const expected="sha512-"+createHash("sha512").update(readFileSync("release/"+f)).digest("base64");
          const url=`https://registry.npmjs.org/${encodeURIComponent(p.name)}/${p.version}`;
          let verified=false;
          for(let attempt=0;attempt<40;attempt++) {
            const response=await fetch(url,{signal:AbortSignal.timeout(10000)});
            if(response.status===200) {
              const metadata=await response.json();
              if(metadata.name!==p.name||metadata.version!==p.version||metadata.dist?.integrity!==expected)
                throw Error("Registry artifact differs; do not overwrite");
              verified=true;break;
            }
            if(response.status!==404) throw Error(`Registry unavailable: ${response.status}; do not republish`);
            console.log("Waiting for registry review/visibility; no second upload");
            await new Promise(r=>setTimeout(r,15000));
          }
          if(!verified) throw Error("Version is not public yet; resume with verify_existing after registry review");
          JS
      - name: Publish immutable GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; inspect immutable assets rather than overwrite"; exit 1
          fi
          gh release create "$TAG" release/* --verify-tag --title "Jetski $TAG" --notes-file docs/release-notes.md
