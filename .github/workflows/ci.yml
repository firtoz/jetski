name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Qualify isolated browser preview sessions
        run: |
          export JETSKI_TEST_CHROME="$(command -v google-chrome)"
          JETSKI_BROWSER_QUALIFY=1 node --import tsx --test test/preview.test.ts
      - name: Qualify standalone local storage example
        run: node --import tsx examples/qualify-storage.ts
      - name: Qualify source-deleted filesystem storage recovery
        run: node --import tsx examples/qualify-filesystem-storage.ts
      - name: Qualify checkpoint storage recovery
        run: node --import tsx examples/qualify-checkpoint-storage.ts
      - run: npm run lint
      - run: python3 -m unittest discover -s host -v
      - run: pipx run --spec ruff==0.17.3 ruff check host examples/qualify-tty.py
      - run: pipx run --spec ruff==0.17.3 ruff format --check host examples/qualify-tty.py
  rootless-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable rootless runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs dbus-user-session
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Resolve test fixture image to approved digest
        run: |
          podman pull docker.io/library/alpine:3.22
          image=$(podman image inspect docker.io/library/alpine:3.22 --format '{{index .RepoDigests 0}}')
          echo "JETSKI_TEST_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Qualify rootless lifecycle and filesystem recovery
        run: python3 host/qualify_podman.py
      - name: Build disposable command supervisor
        run: |
          cc -static -O2 -Wall -Wextra -Werror host/native/command-supervisor.c -o "$RUNNER_TEMP/jetski-supervisor"
          echo "JETSKI_TEST_SUPERVISOR=$RUNNER_TEMP/jetski-supervisor" >> "$GITHUB_ENV"
      - name: Qualify isolated exec sessions
        run: python3 host/qualify_exec.py
      - name: Build and qualify workload-local TCP relay
        run: |
          cc -static -O2 -Wall -Wextra -Werror host/native/tcp-relay.c -o "$RUNNER_TEMP/jetski-tcp-relay"
          cc -static -O2 -Wall -Wextra -Werror host/fixtures/http-server.c -o "$RUNNER_TEMP/jetski-http-fixture"
          JETSKI_TEST_TCP_RELAY="$RUNNER_TEMP/jetski-tcp-relay" JETSKI_TEST_HTTP_FIXTURE="$RUNNER_TEMP/jetski-http-fixture" python3 host/qualify_tcp.py
  ssh-control:
    strategy:
      fail-fast: false
      matrix:
        suite: [ssh, api, boat]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare disposable SSH host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs dbus-user-session openssh-server libssl-dev
          podman pull docker.io/library/alpine:3.22
          image=$(podman image inspect docker.io/library/alpine:3.22 --format '{{index .RepoDigests 0}}')
          echo "JETSKI_TEST_IMAGE=$image" >> "$GITHUB_ENV"
          python3 -c 'import json,sys; json.dump(dict(version=1,machineId="ssh-ci",poolId="ci",images=[sys.argv[1]]),open("/tmp/jetski-host.json","w"))' "$image"
          stat -c '%u %a %n' / /etc /var /var/lib /opt
          # This disposable runner may grant its user ownership of /opt.
          # Production bootstrap must continue rejecting writable ancestors.
          sudo chown root:root /opt
          sudo chmod 755 /opt
          if [ "${{ matrix.suite }}" != "boat" ]; then sudo python3 host/bootstrap.py --config /tmp/jetski-host.json; fi
          mkdir -m 700 "$RUNNER_TEMP/jetski-ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/jetski-ssh/client"
          sudo mkdir -p -m 700 /etc/ssh/jetski-test
          sudo ssh-keygen -q -t ed25519 -N '' -f /etc/ssh/jetski-test/host
          sudo cp "$RUNNER_TEMP/jetski-ssh/client.pub" /etc/ssh/jetski-test/authorized_keys
          sudo chmod 600 /etc/ssh/jetski-test/authorized_keys
          sudo mkdir -p /run/sshd
          sudo tee /etc/ssh/jetski-test/config >/dev/null <<'CONFIG'
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/jetski-test/host
          PidFile /run/jetski-test-sshd.pid
          AuthorizedKeysFile /etc/ssh/jetski-test/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin prohibit-password
          AuthenticationMethods publickey
          AllowUsers root
          AllowTcpForwarding no
          X11Forwarding no
          ForceCommand env -i PATH=/usr/bin:/bin python3 -I /opt/jetski/host/control.py
          CONFIG
          sudo /usr/sbin/sshd -f /etc/ssh/jetski-test/config
          sudo cat /etc/ssh/jetski-test/host.pub | awk '{print "[127.0.0.1]:2222 " $1 " " $2}' > "$RUNNER_TEMP/jetski-ssh/known_hosts"
          awk '{print "[127.0.0.1]:2222 " $1 " " $2}' "$RUNNER_TEMP/jetski-ssh/client.pub" > "$RUNNER_TEMP/jetski-ssh/wrong_hosts"
          echo "JETSKI_TEST_SSH_KEY=$RUNNER_TEMP/jetski-ssh/client" >> "$GITHUB_ENV"
          echo "JETSKI_TEST_KNOWN_HOSTS=$RUNNER_TEMP/jetski-ssh/known_hosts" >> "$GITHUB_ENV"
          echo "JETSKI_TEST_WRONG_HOSTS=$RUNNER_TEMP/jetski-ssh/wrong_hosts" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Build disposable stream listener fixture
        if: matrix.suite == 'ssh'
        run: |
          cc -static -O2 -Wall -Wextra -Werror host/fixtures/http-server.c -o "$RUNNER_TEMP/jetski-http-fixture"
          echo "JETSKI_TEST_HTTP_FIXTURE=$RUNNER_TEMP/jetski-http-fixture" >> "$GITHUB_ENV"
          cc -static -O2 -Wall -Wextra -Werror host/fixtures/browser-server.c -lcrypto -ldl -pthread -o "$RUNNER_TEMP/jetski-browser-fixture"
          echo "JETSKI_TEST_BROWSER_FIXTURE=$RUNNER_TEMP/jetski-browser-fixture" >> "$GITHUB_ENV"
          echo "JETSKI_TEST_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/preview.key" -out "$RUNNER_TEMP/preview.crt" -days 1 -subj /CN=preview.example -addext subjectAltName=DNS:preview.example 2>/dev/null
          echo "JETSKI_TEST_TLS_KEY=$RUNNER_TEMP/preview.key" >> "$GITHUB_ENV"
          echo "JETSKI_TEST_TLS_CERT=$RUNNER_TEMP/preview.crt" >> "$GITHUB_ENV"
      - name: Qualify encrypted control and standalone API
        run: npx tsx examples/qualify-${{ matrix.suite }}.ts
      - name: Diagnose owned runtime service failure
        if: failure()
        run: |
          if id jetski-runtime >/dev/null 2>&1; then
            runtime_uid=$(id -u jetski-runtime)
            sudo journalctl --no-pager -n 60 "_UID=$runtime_uid" _SYSTEMD_USER_UNIT=podman.service
          fi
      - name: Retire disposable listener
        if: always()
        run: |
          if sudo test -f /run/jetski-test-sshd.pid; then sudo kill "$(sudo cat /run/jetski-test-sshd.pid)"; fi
