name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gvisor-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable execution host
        run: |
          sudo timeout --kill-after=5s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
          sudo timeout --kill-after=5s 300s apt-get install -y podman uidmap slirp4netns fuse-overlayfs dbus-user-session gcc libc6-dev
          sudo chown root:root /opt
          sudo chmod 755 /opt
          sudo cc -static -O2 -Wall -Wextra -Werror host/fixtures/memory-server.c -o /tmp/jetski-memory-server
          image=docker.io/library/alpine:3.22
          timeout --kill-after=5s 120s podman pull "$image"
          digest=$(podman image inspect "$image" --format '{{index .RepoDigests 0}}')
          python3 - "$digest" <<'PYTHON'
          import json,sys
          sys.path.insert(0,'host')
          from gvisor_oci import RELEASE,ARCHIVE_SHA256
          value=dict(version=1,machineId='gvisor-ci',poolId='gvisor-ci',images=[sys.argv[1]],runtime=dict(kind='gvisor',version=1,release=RELEASE,archiveSha256=ARCHIVE_SHA256),workloadInit=['/workspace/application','64'])
          with open('/tmp/jetski-gvisor.json','w') as target: json.dump(value,target)
          PYTHON
          # Keep a stalled runner setup diagnosable without weakening runtime checks.
          sudo timeout --kill-after=10s 480s python3 -c "import faulthandler,runpy,sys; faulthandler.dump_traceback_later(60,repeat=True); sys.path.insert(0,'host'); runpy.run_path('host/bootstrap.py',run_name='__main__')" --config /tmp/jetski-gvisor.json
      - name: Qualify native execution, PTY, TCP, RAM and exact local recovery
        run: |
          sudo env GITHUB_ACTIONS=true JETSKI_TEST_MEMORY_SERVER=/tmp/jetski-memory-server python3 host/qualify_gvisor.py
          sudo env GITHUB_ACTIONS=true JETSKI_TEST_MEMORY_SERVER=/tmp/jetski-memory-server python3 host/qualify_portable_memory.py
      - name: Preserve bounded native diagnostics
        if: failure()
        run: |
          sudo journalctl --no-pager -n 60 "_UID=$(id -u jetski-runtime)" || true
          sudo journalctl -k --no-pager -n 60 || true
          sudo find /var/lib/jetski/control -maxdepth 2 -type f -name state.json -exec head -c 20000 {} \; || true
  native-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned compiler on disposable CI runner
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup target add x86_64-unknown-linux-musl
      - run: cargo fmt --manifest-path host-rust/Cargo.toml --check
      - run: cargo test --locked --manifest-path host-rust/Cargo.toml
      - run: cargo clippy --locked --manifest-path host-rust/Cargo.toml --all-targets -- -D warnings
      - run: python3 host-rust/test_install.py
      - run: pipx run --spec ruff==0.17.3 ruff check host-rust/*.py
      - run: pipx run --spec ruff==0.17.3 ruff format --check host-rust/*.py
      - name: Build opt-in static Linux artifact
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --target x86_64-unknown-linux-musl --manifest-path host-rust/Cargo.toml
      - name: Record artifact integrity and source
        run: |
          mkdir -p "$RUNNER_TEMP/jetski-native"
          cp host-rust/target/x86_64-unknown-linux-musl/release/jetski-host "$RUNNER_TEMP/jetski-native/jetski-host"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'jetski-native'
          binary=(root/'jetski-host').read_bytes()
          (root/'manifest.json').write_text(json.dumps(dict(version=1,source=os.environ['GITHUB_SHA'],target='x86_64-unknown-linux-musl',sha256=hashlib.sha256(binary).hexdigest(),bytes=len(binary)),indent=2)+'\n')
          PY
          python3 host-rust/notices.py "$RUNNER_TEMP/jetski-native"
      - uses: actions/upload-artifact@v4
        with:
          name: jetski-native-linux-x86_64
          path: ${{ runner.temp }}/jetski-native/*
          if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Qualify prebuilt artifact in an independent consumer
        run: node scripts/qualify-package.mjs
      - run: npm audit --omit=dev
      - name: Qualify unprivileged container startup, health and restart
        run: node scripts/qualify-container.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build and install release artifact with Bun without lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/jetski-package" "$RUNNER_TEMP/jetski-bun-consumer"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/jetski-package"
          cd "$RUNNER_TEMP/jetski-bun-consumer"
          printf '%s' '{"name":"artifact-consumer","private":true,"type":"module"}' > package.json
          bun add --ignore-scripts "$RUNNER_TEMP/jetski-package/"*.tgz
          bun install --frozen-lockfile --ignore-scripts
          bun --eval 'import {SandboxManager} from "@firtoz/jetski/core";import {JetskiClient} from "@firtoz/jetski/sdk";import {loadBoatBootstrapAssets} from "@firtoz/jetski/host-assets";if(!SandboxManager||!JetskiClient||!(await loadBoatBootstrapAssets()).installer.length)throw Error("Artifact import failed")'
      - uses: actions/upload-artifact@v4
        with:
          name: jetski-package
          path: ${{ runner.temp }}/jetski-package/*.tgz
          if-no-files-found: error
      - run: npm run typecheck
      - run: npm test
      - name: Qualify isolated browser preview sessions
        run: |
          export JETSKI_TEST_CHROME="$(command -v google-chrome)"
          JETSKI_BROWSER_QUALIFY=1 node --import tsx --test test/preview.test.ts
      - name: Qualify standalone local storage example
        run: node --import tsx examples/qualify-storage.ts
      - name: Qualify source-deleted filesystem storage recovery
        run: node --import tsx examples/qualify-filesystem-storage.ts
      - name: Qualify packed source-deleted filesystem recovery
        run: node --import tsx examples/qualify-filesystem-storage.ts --packing
      - name: Qualify real-grace early refusal without advancing clocks
        run: |
          fixture_parent="$RUNNER_TEMP/jetski-real-grace"
          mkdir -m 700 "$fixture_parent"
          printf '%s' '{"kind":"local"}' > "$fixture_parent/storage.json"
          JETSKI_QUALIFICATION_STATE_DIRECTORY="$fixture_parent" node --import tsx examples/qualify-filesystem-storage.ts "$fixture_parent/storage.json" --prepare-gc > "$fixture_parent/prepared.json"
          fixture_path=$(node -e 'console.log(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).retainedStateDirectory)' "$fixture_parent/prepared.json")
          node --import tsx examples/qualify-filesystem-gc.ts "$fixture_path" > "$fixture_parent/early.json"
          node -e 'const r=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8"));require("node:assert/strict").equal(r.waiting,true);require("node:assert/strict").equal(r.deleted,0)' "$fixture_parent/early.json"
      - name: Remove owned local grace fixture
        if: always()
        run: rm -rf "$RUNNER_TEMP/jetski-real-grace"
      - name: Qualify checkpoint storage recovery
        run: node --import tsx examples/qualify-checkpoint-storage.ts
      - name: Qualify packed checkpoint acknowledgement recovery
        run: node --import tsx examples/qualify-checkpoint-storage.ts --packing
      - run: npm run lint
      - run: python3 -m unittest discover -s host -v
      - run: pipx run --spec ruff==0.17.3 ruff check host examples/qualify-tty.py
      - run: pipx run --spec ruff==0.17.3 ruff format --check host examples/qualify-tty.py
  rootless-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable rootless runtime
        run: |
          sudo timeout --kill-after=5s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo timeout --kill-after=5s 300s apt-get install -y podman uidmap slirp4netns fuse-overlayfs dbus-user-session
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Resolve test fixture image to approved digest
        run: |
          timeout --kill-after=5s 120s podman pull docker.io/library/alpine:3.22
          image=$(podman image inspect docker.io/library/alpine:3.22 --format '{{index .RepoDigests 0}}')
          echo "JETSKI_TEST_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Qualify rootless lifecycle and filesystem recovery
        run: python3 host/qualify_podman.py
      - name: Qualify explicit egress and host-loopback denial
        run: python3 host/qualify_egress.py
      - name: Build disposable command supervisor
        run: |
          cc -static -O2 -Wall -Wextra -Werror host/native/command-supervisor.c -o "$RUNNER_TEMP/jetski-supervisor"
          echo "JETSKI_TEST_SUPERVISOR=$RUNNER_TEMP/jetski-supervisor" >> "$GITHUB_ENV"
      - name: Qualify isolated exec sessions
        run: python3 host/qualify_exec.py
      - name: Build and qualify workload-local TCP relay
        run: |
          cc -static -O2 -Wall -Wextra -Werror host/native/tcp-relay.c -o "$RUNNER_TEMP/jetski-tcp-relay"
          cc -static -O2 -Wall -Wextra -Werror host/fixtures/http-server.c -o "$RUNNER_TEMP/jetski-http-fixture"
          JETSKI_TEST_TCP_RELAY="$RUNNER_TEMP/jetski-tcp-relay" JETSKI_TEST_HTTP_FIXTURE="$RUNNER_TEMP/jetski-http-fixture" python3 host/qualify_tcp.py
  ssh-control:
    strategy:
      fail-fast: false
      matrix:
        suite: [ssh, api, boat]
        storageMode: [default]
        include:
          - suite: ssh
            storageMode: fuse-overlayfs
          - suite: boat
            storageMode: fuse-overlayfs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JETSKI_TEST_STORAGE_MODE: ${{ matrix.storageMode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare disposable SSH host
        run: |
          sudo timeout --kill-after=5s 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo timeout --kill-after=5s 300s apt-get install -y podman uidmap slirp4netns fuse-overlayfs dbus-user-session openssh-server libssl-dev
          timeout --kill-after=5s 120s podman pull docker.io/library/alpine:3.22
          image=$(podman image inspect docker.io/library/alpine:3.22 --format '{{index .RepoDigests 0}}')
          echo "JETSKI_TEST_IMAGE=$image" >> "$GITHUB_ENV"
          if [ "$JETSKI_TEST_STORAGE_MODE" = "fuse-overlayfs" ]; then test -c /dev/fuse || sudo modprobe fuse; fi
          python3 -c 'import json,sys,os; json.dump(dict(version=1,machineId="ssh-ci",poolId="ci",images=[sys.argv[1]],storageMode=os.environ["JETSKI_TEST_STORAGE_MODE"]),open("/tmp/jetski-host.json","w"))' "$image"
          stat -c '%u %a %n' / /etc /var /var/lib /opt
          # This disposable runner may grant its user ownership of /opt.
          # Production bootstrap must continue rejecting writable ancestors.
          if [ "${{ matrix.suite }}" = "boat" ]; then
            # Match the provider stock image; the owned-host adapter must secure it.
            sudo chown "$(id -u):$(id -g)" /opt
          else
            sudo chown root:root /opt
          fi
          sudo chmod 755 /opt
          if [ "${{ matrix.suite }}" != "boat" ]; then sudo python3 host/bootstrap.py --config /tmp/jetski-host.json; fi
          mkdir -m 700 "$RUNNER_TEMP/jetski-ssh"
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/jetski-ssh/client"
          sudo mkdir -p -m 700 /etc/ssh/jetski-test
          sudo ssh-keygen -q -t ed25519 -N '' -f /etc/ssh/jetski-test/host
          sudo cp "$RUNNER_TEMP/jetski-ssh/client.pub" /etc/ssh/jetski-test/authorized_keys
          sudo chmod 644 /etc/ssh/jetski-test/authorized_keys
          sudo chmod 755 /etc/ssh/jetski-test
          if [ "${{ matrix.suite }}" = "boat" ]; then
            sudo useradd -m -s /bin/bash user
            sudo passwd -d user
            echo 'user ALL=(root) NOPASSWD: /usr/bin/env -i PATH=/usr/bin\:/bin python3 -I /opt/jetski/host/control.py' | sudo tee /etc/sudoers.d/jetski-test-user >/dev/null
            sudo chmod 440 /etc/sudoers.d/jetski-test-user
            sudo visudo -cf /etc/sudoers.d/jetski-test-user
          fi
          sudo mkdir -p /run/sshd
          sudo tee /etc/ssh/jetski-test/config >/dev/null <<'CONFIG'
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/jetski-test/host
          PidFile /run/jetski-test-sshd.pid
          AuthorizedKeysFile /etc/ssh/jetski-test/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin prohibit-password
          AuthenticationMethods publickey
          AllowUsers root user
          AllowTcpForwarding no
          X11Forwarding no
          ForceCommand sudo -n env -i PATH=/usr/bin:/bin python3 -I /opt/jetski/host/control.py
          CONFIG
          sudo /usr/sbin/sshd -f /etc/ssh/jetski-test/config
          sudo cat /etc/ssh/jetski-test/host.pub | awk '{print "[127.0.0.1]:2222 " $1 " " $2}' > "$RUNNER_TEMP/jetski-ssh/known_hosts"
          awk '{print "[127.0.0.1]:2222 " $1 " " $2}' "$RUNNER_TEMP/jetski-ssh/client.pub" > "$RUNNER_TEMP/jetski-ssh/wrong_hosts"
          echo "JETSKI_TEST_SSH_KEY=$RUNNER_TEMP/jetski-ssh/client" >> "$GITHUB_ENV"
          echo "JETSKI_TEST_KNOWN_HOSTS=$RUNNER_TEMP/jetski-ssh/known_hosts" >> "$GITHUB_ENV"
          echo "JETSKI_TEST_WRONG_HOSTS=$RUNNER_TEMP/jetski-ssh/wrong_hosts" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Build disposable stream listener fixture
        if: matrix.suite == 'ssh' || matrix.suite == 'boat'
        run: |
          cc -static -O2 -Wall -Wextra -Werror host/fixtures/http-server.c -o "$RUNNER_TEMP/jetski-http-fixture"
          echo "JETSKI_TEST_HTTP_FIXTURE=$RUNNER_TEMP/jetski-http-fixture" >> "$GITHUB_ENV"
          cc -static -O2 -Wall -Wextra -Werror host/fixtures/browser-server.c -lcrypto -ldl -pthread -o "$RUNNER_TEMP/jetski-browser-fixture"
          echo "JETSKI_TEST_BROWSER_FIXTURE=$RUNNER_TEMP/jetski-browser-fixture" >> "$GITHUB_ENV"
          echo "JETSKI_TEST_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/preview.key" -out "$RUNNER_TEMP/preview.crt" -days 1 -subj /CN=preview.example -addext subjectAltName=DNS:preview.example 2>/dev/null
          echo "JETSKI_TEST_TLS_KEY=$RUNNER_TEMP/preview.key" >> "$GITHUB_ENV"
          echo "JETSKI_TEST_TLS_CERT=$RUNNER_TEMP/preview.crt" >> "$GITHUB_ENV"
      - name: Qualify encrypted control and standalone API
        run: npx tsx examples/qualify-${{ matrix.suite }}.ts
      - name: Diagnose owned runtime service failure
        if: failure()
        run: |
          if id jetski-runtime >/dev/null 2>&1; then
            runtime_uid=$(id -u jetski-runtime)
            sudo journalctl --no-pager -n 60 "_UID=$runtime_uid" _SYSTEMD_USER_UNIT=podman.service
            sudo python3 host/diagnose_runtime.py
          fi
      - name: Retire disposable listener
        if: always()
        run: |
          if sudo test -f /run/jetski-test-sshd.pid; then sudo kill "$(sudo cat /run/jetski-test-sshd.pid)"; fi
